<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14171a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Sawwag</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">

<style>
:root{color-scheme:dark;--bg:#14171a;--panel:#1d2227;--line:#2c333a;--text:#ece9e1;--muted:#98a0a8;--yellow:#f5c518;--red:#e5484d}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic","Noto Nastaliq Urdu",system-ui,sans-serif}
#auth{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;padding:28px;gap:12px;max-width:420px;margin:auto}
#auth h1{font-size:34px;margin:0 0 4px}
#auth p{margin:0 0 12px;color:var(--muted)}
#auth .developer{margin:12px 0 0;text-align:center;color:var(--yellow);font-size:14px;font-weight:700;line-height:1.8}
input{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:16px;border-radius:10px;font:inherit;font-size:17px;direction:ltr;text-align:left}
input:focus,button:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:16px;font-size:17px;cursor:pointer}
.primary{background:var(--yellow);color:#14171a}
.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
#err{color:var(--red);min-height:22px;font-size:15px}
.langs{display:flex;gap:8px;margin-bottom:8px}
.lang{padding:8px 14px;font-size:14px;border-radius:999px;background:var(--panel);color:var(--muted);border:1px solid var(--line)}
.lang.on{background:var(--yellow);color:#14171a;border-color:var(--yellow)}
#app{display:none;position:fixed;inset:0}
#map{position:absolute;inset:0;background:#1d2227}
#top{position:absolute;top:0;left:0;right:0;z-index:1000;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;display:flex;justify-content:space-between;align-items:center;gap:8px;pointer-events:none}
#top>*{pointer-events:auto}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:14px;color:var(--muted)}
#alert{position:absolute;top:calc(env(safe-area-inset-top,0px) + 56px);left:12px;right:12px;z-index:1001;border-radius:12px;padding:16px;font-weight:700;font-size:20px;display:none;text-align:center;color:#fff}
#bar{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);left:20px;right:20px;z-index:1000;display:flex;flex-direction:column;gap:10px}
#loc{align-self:flex-start;background:var(--panel);color:var(--text);border:1px solid var(--line);padding:12px 16px;font-size:15px}
#report{background:var(--yellow);color:#14171a;font-size:24px;padding:22px;border-radius:16px;box-shadow:0 4px 0 #a98600}
#report:active{transform:translateY(3px);box-shadow:0 1px 0 #a98600}
.me{width:18px;height:18px;border-radius:50%;background:#3b9eff;border:3px solid #fff;box-shadow:0 0 0 6px rgba(59,158,255,.3)}
.pat{font-size:30px;line-height:1;filter:drop-shadow(0 2px 2px #000)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel);color:var(--text)}
.leaflet-popup-content{font-family:inherit;text-align:center;margin:12px}
.leaflet-popup-content button{margin:6px 3px 0;padding:10px 14px;font-size:15px}
.dim{color:var(--muted);font-size:13px}
</style>
</head>

<body>

<div id="auth">
  <div class="langs" id="langs1"></div>
  <h1 data-i="title"></h1>
  <p data-i="sub"></p>
  <input id="email" type="email" autocomplete="email">
  <input id="pass" type="password" autocomplete="current-password">
  <div id="err"></div>
  <button class="primary" data-i="login" onclick="doAuth('login')"></button>
  <button class="ghost" data-i="signup" onclick="doAuth('signup')"></button>
  <p class="developer">المطور: (محمد تاج الدين)</p>
</div>

<div id="app">
  <div id="map"></div>
  <div id="top">
    <span class="chip" id="status"></span>
    <span style="display:flex;gap:8px;align-items:center">
      <span class="langs" id="langs2" style="margin:0"></span>
      <button class="chip" data-i="logout" onclick="firebase.auth().signOut()"></button>
    </span>
  </div>
  <div id="alert"></div>
  <div id="bar">
    <button id="loc" data-i="locate" onclick="locate()"></button>
    <button id="report" data-i="report" onclick="sendReport()"></button>
  </div>
</div>

<script>
/* ===== Firebase ===== */

  authDomain: "sawwag-road.firebaseapp.com",

};

const NAMES = {ar:'عربي',en:'EN',ur:'اردو'};
let lang = 'ar';

try {
  lang = localStorage.getItem('lang') ||
    (/^ur/.test(navigator.language) ? 'ur' :
    /^en/.test(navigator.language) ? 'en' : 'ar');
} catch(e) {}

const t = (k,v={}) =>
  (T[lang][k] || k).replace(/{(\w)}/g,(_,x)=>v[x]);

function setLang(l) {
  lang = l;
  try { localStorage.setItem('lang',l); } catch(e) {}

  document.documentElement.lang = l;
  document.documentElement.dir = l === 'en' ? 'ltr' : 'rtl';

  document.querySelectorAll('[data-i]').forEach(el=>{
    el.textContent = t(el.dataset.i);
  });

  document.getElementById('email').placeholder = t('email');
  document.getElementById('pass').placeholder = t('pass');

  ['langs1','langs2'].forEach(id=>{
    document.getElementById(id).innerHTML =
      Object.keys(NAMES).map(k =>
        '<button class="lang'+(k===l?' on':'')+
        '" onclick="setLang(\''+k+'\')">'+NAMES[k]+'</button>'
      ).join('');
  });

  setStatus(pos ? 'locOk' : 'finding');
  Object.keys(data).forEach(draw);
}

/* ===== Firebase ===== */
firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let me = null;
let pos = null;
let map, meMarker;
let followed = true;
let first = true;
let unsub = null;
let statusKey = 'finding';

const markers = {};
const data = {};
const seen = {};

const ERR = {
'auth/invalid-email':'e_email',
'auth/missing-email':'e_email',
'auth/missing-password':'e_pass',
'auth/weak-password':'e_weak',
'auth/email-already-in-use':'e_used',
'auth/invalid-credential':'e_bad',
'auth/user-not-found':'e_bad',
'auth/wrong-password':'e_bad',
'auth/network-request-failed':'e_net'
};

/* ===== تسجيل الدخول وإنشاء الحساب ===== */
async function doAuth(kind) {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('pass').value;
  const errorBox = document.getElementById('err');

  errorBox.textContent = '';

  if (!email) {
    errorBox.textContent = t('e_email');
    return;
  }

  const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if (!emailPattern.test(email)) {
    errorBox.textContent = t('e_email');
    return;
  }

  if (!password) {
    errorBox.textContent = t('e_pass');
    return;
  }

  if (kind === 'signup' && password.length < 6) {
    errorBox.textContent = t('e_weak');
    return;
  }

  try {
    if (kind === 'signup') {
      await auth.createUserWithEmailAndPassword(email,password);
    } else {
      await auth.signInWithEmailAndPassword(email,password);
    }
  } catch(e) {
    errorBox.textContent = t(ERR[e.code] || 'e_gen');
  }
}

auth.onAuthStateChanged(user=>{
  me = user;

  document.getElementById('auth').style.display =
    user ? 'none' : 'flex';

  document.getElementById('app').style.display =
    user ? 'block' : 'none';

  if (user) startApp();
  else stopApp();
});

/* ===== الخريطة والموقع ===== */
function startApp() {
  if (!map) {
    map = L.map('map',{zoomControl:false})
      .setView([24.7136,46.6753],11);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
      maxZoom:19,
      attribution:'© OpenStreetMap'
    }).addTo(map);

    map.on('dragstart',()=>followed=false);

    meMarker = L.marker([0,0],{
      icon:L.divIcon({
        className:'',
        html:'<div class="me"></div>',
        iconSize:[18,18]
      })
    });

    navigator.geolocation.watchPosition(
      onPos,
      ()=>setStatus('locOff'),
      {enableHighAccuracy:true,maximumAge:3000}
    );
  }

  setTimeout(()=>map.invalidateSize(),100);
  listen();
}

function stopApp() {
  if (unsub) {
    unsub();
    unsub = null;
  }

  Object.keys(markers).forEach(removeMarker);
}

function setStatus(k) {
  statusKey = k;
  document.getElementById('status').textContent = t(k);
}

function onPos(p) {
  pos = {
    lat:p.coords.latitude,
    lng:p.coords.longitude
  };

  meMarker.setLatLng([pos.lat,pos.lng]).addTo(map);

  if (followed) {
    map.setView(
      [pos.lat,pos.lng],
      first ? 16 : Math.max(map.getZoom(),15)
    );
    first = false;
  }

  setStatus('locOk');
}

function locate() {
  followed = true;

  if (pos) {
    map.setView(
      [pos.lat,pos.lng],
      Math.max(map.getZoom(),15)
    );
  } else {
    navigator.geolocation.getCurrentPosition(
      onPos,
      ()=>setStatus('locOff'),
      {enableHighAccuracy:true}
    );
  }
}

/* ===== حساب المسافة ===== */
function km(a,b,c,d) {
  const R = 6371;
  const rad = x => x * Math.PI / 180;

  const dl = rad(c-a);
  const dn = rad(d-b);

  const h =
    Math.sin(dl/2)**2 +
    Math.cos(rad(a))*Math.cos(rad(c))*
    Math.sin(dn/2)**2;

  return 2*R*Math.asin(Math.sqrt(h));
}

/* ===== إرسال البلاغ ===== */
async function sendReport() {
  if (!pos) {
    showAlert(t('noLoc'),false);
    return;
  }

  let last = 0;

  try {
    last = +localStorage.getItem('lastReport') || 0;
  } catch(e) {}

  if (Date.now()-last < COOLDOWN_SEC*1000) {
    showAlert(t('wait'),false);
    return;
  }

  try {
    await db.collection('reports').add({
      lat:pos.lat,
      lng:pos.lng,
      uid:me.uid,
      ts:Date.now(),
      yes:0,
      no:0,
      voters:{}
    });

    try {
      localStorage.setItem('lastReport',Date.now());
    } catch(e) {}

    showAlert(t('sent'),false);
  } catch(e) {
    showAlert(t('sendFail'),false);
  }
}

/* ===== استقبال البلاغات ===== */
function listen() {
  if (unsub) return;

  const since = Date.now() - LIFETIME_MIN*60000;

  unsub = db.collection('reports')
    .where('ts','>',since)
    .onSnapshot(snapshot=>{

      snapshot.docChanges().forEach(change=>{
        const id = change.doc.id;
        const report = change.doc.data();

        if (change.type === 'removed') {
          removeMarker(id);
          return;
        }

        data[id] = report;
        draw(id);

        if (change.type === 'added' && !seen[id]) {
          seen[id] = 1;

          if (
            report.uid !== me.uid &&
            pos &&
            Date.now()-report.ts < 5*60000 &&
            report.no-report.yes < HIDE_AT
          ) {
            const distance = km(
              pos.lat,
              pos.lng,
              report.lat,
              report.lng
            );

            if (distance <= ALERT_KM) {
              showAlert(
                t('near',{d:distance.toFixed(1)}),
                true
              );
            }
          }
        }
      });
    });
}

/* ===== إظهار البلاغات على الخريطة ===== */
function draw(id) {
  const report = data[id];

  if (
    !report ||
    report.no-report.yes >= HIDE_AT ||
    Date.now()-report.ts > LIFETIME_MIN*60000
  ) {
    removeMarker(id);
    return;
  }

  const minutes = Math.max(
    0,
    Math.round((Date.now()-report.ts)/60000)
  );

  const voted = report.voters && report.voters[me.uid];

  const html =
    '<b>'+t('patrol')+'</b>' +
    '<div class="dim">'+t('ago',{m:minutes})+'</div>' +
    (voted
      ? '<div class="dim">'+t('thanks')+'</div>'
      : '<div>'+t('still')+'</div>' +
        '<button class="primary" onclick="vote(\''+id+'\',1)">'+
        t('yes')+'</button>' +
        '<button class="ghost" onclick="vote(\''+id+'\',0)">'+
        t('gone')+'</button>'
    );

  if (markers[id]) {
    markers[id].setPopupContent(html);
    return;
  }

  markers[id] = L.marker(
    [report.lat,report.lng],
    {
      icon:L.divIcon({
        className:'',
        html:'<div class="pat">🚓</div>',
        iconSize:[30,30]
      })
    }
  ).addTo(map).bindPopup(html);
}

function removeMarker(id) {
  if (markers[id]) {
    map.removeLayer(markers[id]);
    delete markers[id];
  }

  delete data[id];
}

/* ===== التصويت على البلاغ ===== */
async function vote(id,yes) {
  try {
    await db.collection('reports').doc(id).update({
      [yes ? 'yes' : 'no']:
        firebase.firestore.FieldValue.increment(1),
      ['voters.'+me.uid]:true
    });

    map.closePopup();
  } catch(e) {
    showAlert(t('voteFail'),false);
  }
}

/* ===== تحديث البلاغات ===== */
setInterval(()=>{
  Object.keys(data).forEach(draw);
},30000);

/* ===== تهيئة صوت الصفارة ===== */
let audioContext = null;
let audioReady = false;

async function enableAudio() {
  try {
    const AudioCtx =
      window.AudioContext || window.webkitAudioContext;

    if (!AudioCtx) return;

    if (!audioContext) {
      audioContext = new AudioCtx();
    }

    if (audioContext.state === 'suspended') {
      await audioContext.resume();
    }

    audioReady = audioContext.state === 'running';
  } catch(e) {
    audioReady = false;
  }
}

/* أول تفاعل من المستخدم يجهّز الصوت */
document.addEventListener('pointerdown',enableAudio);
document.addEventListener('touchstart',enableAudio);

/* ===== صفارة الشرطة ===== */
function playPoliceSiren() {
  try {
    if (!audioContext || !audioReady) return;

    if (audioContext.state !== 'running') {
      audioContext.resume();
    }

    const ac = audioContext;

    const playTone = (start,duration,from,to)=>{
      const osc = ac.createOscillator();
      const gain = ac.createGain();

      osc.type = 'sawtooth';

      osc.frequency.setValueAtTime(
        from,
        ac.currentTime+start
      );

      osc.frequency.linearRampToValueAtTime(
        to,
        ac.currentTime+start+duration
      );

      gain.gain.setValueAtTime(
        0,
        ac.currentTime+start
      );

      gain.gain.linearRampToValueAtTime(
        0.16,
        ac.currentTime+start+0.04
      );

      gain.gain.setValueAtTime(
        0.16,
        ac.currentTime+start+duration-0.04
      );

      gain.gain.linearRampToValueAtTime(
        0,
        ac.currentTime+start+duration
      );

      osc.connect(gain);
      gain.connect(ac.destination);

      osc.start(ac.currentTime+start);
      osc.stop(ac.currentTime+start+duration);
    };

    playTone(0,0.35,650,1050);
    playTone(0.4,0.35,1050,650);
    playTone(0.8,0.35,650,1050);
    playTone(1.2,0.35,1050,650);

  } catch(e) {}
}

/* ===== التنبيه والاهتزاز ===== */
let alertTimer;

function showAlert(message,loud) {
  const el = document.getElementById('alert');

  el.textContent = message;
  el.style.display = 'block';
  el.style.background = loud ? 'var(--red)' : '#2c333a';

  clearTimeout(alertTimer);

  alertTimer = setTimeout(()=>{
    el.style.display = 'none';
  },loud ? 10000 : 3000);

  if (loud) {
    try {
      if (navigator.vibrate) {
        navigator.vibrate([300,150,300,150,300]);
      }
    } catch(e) {}

    playPoliceSiren();
  }
}

/* ===== تشغيل اللغة ===== */
setLang(lang);

/* ===== Service Worker ===== */
if ('serviceWorker' in navigator) {
  addEventListener('load',()=>{
    navigator.serviceWorker
      .register('sw.js')
      .catch(()=>{});
  });
}
